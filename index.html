<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷題</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e0d8;
  --accent:#1d4e89;--accent-soft:#e7eef7;--ok:#1f7a4d;--ok-soft:#e5f3eb;--bad:#b42318;--bad-soft:#fbeae8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a;--card:#1e2125;--ink:#e8e6e1;--muted:#9a9ea5;--line:#33373d;
  --accent:#7fb0ea;--accent-soft:#1f2c3b;--ok:#5cc58f;--ok-soft:#173226;--bad:#f0796d;--bad-soft:#3a1d1a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
header{padding:18px 0 8px}
header h1{font-size:1.35rem;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.round{font-weight:700;color:var(--accent);white-space:nowrap}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.q .no{font-size:.8rem;color:var(--muted);font-weight:600}
.q .stem{margin:4px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt input{margin-top:6px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.75rem;font-weight:700;white-space:nowrap}
.opt.correct .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.exp{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.93rem}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.msg{flex:1;font-size:.88rem;color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.primary{color:#0f1720}}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.score div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.score b{display:block;font-size:1.8rem;line-height:1.2}
.score .ok b{color:var(--ok)}.score .bad b{color:var(--bad)}
.score span{font-size:.82rem;color:var(--muted)}
h2{font-size:1.1rem;margin:22px 0 4px}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:3rem}
.hist{font-size:.88rem;color:var(--muted);margin-top:6px}
.qhead{display:flex;align-items:center;gap:8px}
.marks{margin-left:auto;display:flex;align-items:center;gap:2px}
.marks button{background:none;padding:2px 3px;font-size:1.15rem;line-height:1;color:var(--line);font-weight:400}
.marks button.on{color:#e3a008}
.marks .fav{margin-left:6px;color:var(--line)}
.marks .fav.on{color:#e0245e}
.setup .choice{display:flex;align-items:center;gap:10px;padding:14px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.setup .choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.setup .choice .n{margin-left:auto;color:var(--muted);font-size:.9rem}
.setup select{font:inherit;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.linkbtn{background:none;padding:0;color:var(--muted);font-weight:400;font-size:.85rem;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">刷題</h1>
    <p id="subtitle"></p>
  </header>
  <div class="bar">
    <span class="round" id="round"></span>
    <div class="prog"><i id="progbar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <main id="main"></main>
</div>
<div class="foot"><div class="in" id="foot"></div></div>

<script src="banks/index.js"></script>
<script>
const NUM = ["①","②","③","④","⑤","⑥"];
// ---------- 題庫 ----------
const BANKS = [];
function registerBank(b){
  // 資料自檢：格式壞掉的題目會在 console 報錯
  b.questions.forEach((x,i)=>{ if(!x.q||!x.e||!(x.o.length>=2&&x.o.length<=NUM.length)||!(x.a>=1&&x.a<=x.o.length)) console.error("bad question", b.id, i+1); });
  BANKS.push(b);
}
let BANK = null, QUESTIONS = [], KEY = "", MKEY = "";
const bankKey = b => b.storageKey || ("quiz-" + b.id);
function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

function loadBanks(){
  let i = 0;
  (function next(){
    if (i >= BANK_FILES.length) return renderBanks();
    const el = document.createElement("script");
    el.src = "banks/" + BANK_FILES[i++];
    el.onload = next;
    el.onerror = () => { console.warn("載入失敗：" + el.src); next(); };
    document.body.appendChild(el);
  })();
}

function renderBanks(){
  BANK = null;
  $("title").textContent = "刷題"; $("subtitle").textContent = "選擇題目庫";
  document.title = "刷題";
  $("round").textContent = "題庫"; $("count").textContent = `${BANKS.length} 個`; $("progbar").style.width = "0";
  $("main").innerHTML = `<div class="setup">${BANKS.map((b, i) => {
    const k = bankKey(b), st = readJSON(k + "-quiz-v1"), mk = readJSON(k + "-marks-v1") || {};
    const favs = Object.values(mk).filter(m => m.f).length;
    const n = b.questions.length;
    const avg = (b.questions.reduce((t, _, j) => t + ((mk[j] && mk[j].s) || 0), 0) / n).toFixed(1);
    const status = st && st.phase === "quiz" && st.pool && st.pool.length ? `・進行中（第 ${st.round} 輪）` : st && st.phase === "result" ? "・待重做錯題" : "";
    return `<div class="choice" onclick="selectBank(${i})"><div><b>${esc(b.title)}</b>
      <div class="hist" style="margin:0">${esc(b.desc || "")}</div>
      <div class="hist" style="margin:0">${n} 題・平均 ${avg}★・${favs} ♥${status}</div></div><span class="n">›</span></div>`;
  }).join("") || "<p>沒有題庫</p>"}</div>`;
  $("foot").innerHTML = `<span style="flex:1"></span>`;
}

function selectBank(i){
  BANK = BANKS[i]; QUESTIONS = BANK.questions;
  KEY = bankKey(BANK) + "-quiz-v1"; MKEY = bankKey(BANK) + "-marks-v1";
  M = readJSON(MKEY) || {};
  $("title").textContent = BANK.title; $("subtitle").textContent = `${QUESTIONS.length} 題・${BANK.desc || ""}`;
  document.title = BANK.title.replace(/\s+/g, " ") + "｜刷題";
  S = load();
  if (S && Array.isArray(S.pool)){  // 題庫縮短後，丟掉已不存在的題號
    S.pool = S.pool.filter(i => i < QUESTIONS.length);
    S.lastWrong = (S.lastWrong || []).filter(i => i < QUESTIONS.length);
  }
  if (!S || !Array.isArray(S.pool) || (S.phase !== "setup" && !S.pool.length)) S = fresh();
  if (!S.scope) { S.scope = "all"; S.minStar = 3; }
  if (S.phase === "done") S = Object.assign(fresh(), {scope:S.scope, minStar:S.minStar});
  render(); window.scrollTo(0,0);
}
function backToBanks(){ renderBanks(); window.scrollTo(0,0); }

let S; // {round, pool:[idx], answers:{idx:choice}, phase:'quiz'|'result'|'done', lastWrong:[], history:[{round,total,correct}]}

let M = {}; // {qi: {s:0-5, f:0|1}}
function saveMarks(){ try{ localStorage.setItem(MKEY, JSON.stringify(M)); }catch(e){} }
const star = i => (M[i] && M[i].s) || 0;
const fav = i => (M[i] && M[i].f) || 0;

function marksHTML(qi){
  let h = `<span class="marks" id="mk${qi}">`;
  for (let k=1;k<=5;k++) h += `<button class="${star(qi)>=k?"on":""}" onclick="setStar(${qi},${k})" aria-label="${k} 星">★</button>`;
  h += `<button class="fav${fav(qi)?" on":""}" onclick="toggleFav(${qi})" aria-label="收藏">♥</button></span>`;
  return h;
}
function refreshMarks(qi){
  document.querySelectorAll(`#mk${qi}`).forEach(el => el.outerHTML = marksHTML(qi));
}
function setStar(qi, k){
  M[qi] = {s: star(qi) === k ? 0 : k, f: fav(qi)};   // 再點同一顆星 = 清除
  saveMarks(); refreshMarks(qi);
}
function toggleFav(qi){
  M[qi] = {s: star(qi), f: fav(qi) ? 0 : 1};
  saveMarks(); refreshMarks(qi);
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function fresh(){ return {round:1, pool:[], answers:{}, phase:"setup", lastWrong:[], history:[], scope:"all", minStar:3}; }

function scopePool(scope, minStar){
  const all = QUESTIONS.map((_,i)=>i);
  if (scope === "fav") return all.filter(i => fav(i));
  if (scope === "star") return all.filter(i => star(i) <= minStar);
  return all;
}
function renderSetup(){
  const ms = S.minStar ?? 3;
  const c = {all:QUESTIONS.length, fav:scopePool("fav").length, star:scopePool("star", ms).length};
  const opt = (v, label) => `<label class="choice${S.scope===v?" sel":""}"><input type="radio" name="scope" ${S.scope===v?"checked":""} onchange="S.scope='${v}';renderSetup()"> ${label}<span class="n">${c[v]} 題</span></label>`;
  const sel = `<select onchange="S.minStar=+this.value;S.scope='star';renderSetup()" onclick="event.stopPropagation()">${[0,1,2,3,4,5].map(n=>`<option ${n===ms?"selected":""}>${n}</option>`).join("")}</select>`;
  $("main").innerHTML = `<div class="setup"><h2>選擇練習範圍</h2>
    ${opt("all","全部題目")}${opt("fav","♥ 只刷收藏")}${opt("star",`★ 只刷 ≤ ${sel} 星`)}</div>`;
  const n = c[S.scope];
  $("foot").innerHTML = `<button class="ghost" onclick="backToBanks()">‹ 題庫</button><span class="msg">${n?"":"這個範圍目前沒有題目"}</span><button class="primary" ${n?"":"disabled style='opacity:.4'"} onclick="startQuiz()">開始作答</button>`;
  $("round").textContent = "準備"; $("count").textContent = ""; $("progbar").style.width = "0";
}
function startQuiz(){
  S.pool = scopePool(S.scope, S.minStar ?? 3);
  if (!S.pool.length) return;
  S.answers = {}; S.round = 1; S.history = []; S.lastWrong = []; S.phase = "quiz";
  save(); render(); window.scrollTo(0,0);
}
const scopeLabel = () => S.scope === "fav" ? "收藏題" : S.scope === "star" ? `≤${S.minStar}星` : "全部";

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function header(){
  $("round").textContent = (S.round === 1 ? "第 1 輪" : `第 ${S.round} 輪・錯題`) + `（${scopeLabel()}）`;
  const n = S.pool.length, a = S.pool.filter(i => S.answers[i]).length;
  $("count").textContent = S.phase === "quiz" ? `已答 ${a}/${n}` : `共 ${n} 題`;
  $("progbar").style.width = (S.phase === "quiz" ? a/n*100 : 100) + "%";
}

function renderQuiz(){
  confirmArmed = false;
  const html = S.pool.map((qi, k) => {
    const Q = QUESTIONS[qi];
    const opts = Q.o.map((t, j) => {
      const v = j+1, sel = S.answers[qi] === v;
      return `<label class="opt${sel?" sel":""}"><input type="radio" name="q${qi}" value="${v}" ${sel?"checked":""} onchange="pick(${qi},${v})"><span>${NUM[j]} ${esc(t)}</span></label>`;
    }).join("");
    return `<section class="q" id="card${qi}"><div class="qhead"><span class="no">${k+1}／${S.pool.length}　（原第 ${qi+1} 題）</span>${marksHTML(qi)}</div><div class="stem">${esc(Q.q)}</div>${opts}</section>`;
  }).join("");
  $("main").innerHTML = html;
  $("foot").innerHTML = `<button class="linkbtn" onclick="restart()">換範圍</button><span class="msg" id="msg"></span><button class="primary" onclick="submitQuiz()">交卷</button>`;
  header();
}

function pick(qi, v){
  S.answers[qi] = v;
  document.querySelectorAll(`#card${qi} .opt`).forEach((el, j) => el.classList.toggle("sel", j+1 === v));
  $("msg").textContent = "";
  save(); header();
}

let confirmArmed = false;
function submitQuiz(){
  const missing = S.pool.filter(i => !S.answers[i]);
  if (missing.length && !confirmArmed){
    confirmArmed = true;
    $("msg").textContent = `還有 ${missing.length} 題沒作答（算錯）。再按一次交卷確認。`;
    document.getElementById("card"+missing[0]).scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  confirmArmed = false;
  const wrong = S.pool.filter(i => S.answers[i] !== QUESTIONS[i].a);
  // 自動星等：答對 +1（上限 5），答錯/未答 −1（下限 0）；答錯/未答自動收藏
  S.pool.forEach(i => {
    const ok = S.answers[i] === QUESTIONS[i].a;
    M[i] = {s: Math.max(0, Math.min(5, star(i) + (ok ? 1 : -1))), f: ok ? fav(i) : 1};
  });
  saveMarks();
  S.history.push({round:S.round, total:S.pool.length, correct:S.pool.length - wrong.length});
  S.lastWrong = wrong;
  S.phase = wrong.length ? "result" : "done";
  save(); render(); window.scrollTo(0,0);
}

function reviewCard(qi){
  const Q = QUESTIONS[qi], mine = S.answers[qi];
  const opts = Q.o.map((t, j) => {
    const v = j+1;
    let cls = "", tag = "";
    if (v === Q.a){ cls = " correct"; tag = "正解"; }
    else if (v === mine){ cls = " wrong"; tag = "你的答案"; }
    return `<div class="opt${cls}"><span>${NUM[j]} ${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:""}</div>`;
  }).join("");
  const note = mine ? "" : `<div class="msg" style="margin-bottom:6px">未作答</div>`;
  return `<section class="q"><div class="qhead"><span class="no">原第 ${qi+1} 題</span>${marksHTML(qi)}</div><div class="stem">${esc(Q.q)}</div>${note}${opts}<div class="exp"><b>解析</b>　${esc(Q.e)}</div></section>`;
}

function histLine(){
  return S.history.map(h => `第 ${h.round} 輪 ${h.correct}/${h.total}`).join("　→　");
}

function renderResult(){
  const h = S.history[S.history.length-1], w = S.lastWrong.length;
  $("main").innerHTML = `
    <div class="score">
      <div class="ok"><b>${h.correct}</b><span>答對</span></div>
      <div class="bad"><b>${w}</b><span>答錯</span></div>
      <div><b>${Math.round(h.correct/h.total*100)}%</b><span>正確率</span></div>
    </div>
    <div class="hist">${histLine()}</div>
    <h2>錯題檢視（${w} 題）</h2>
    ${S.lastWrong.map(reviewCard).join("")}`;
  $("foot").innerHTML = `<button class="ghost" onclick="restart()">換範圍／重來</button><span style="flex:1"></span><button class="primary" onclick="retry()">重做錯題（${w} 題）</button>`;
  header();
}

function renderDone(){
  const total = S.history.length;
  $("main").innerHTML = `<div class="done"><div class="big">🎉</div><h2>全部答對！</h2>
    <p>${total === 1 ? "第一輪就全對，太強了。" : `經過 ${total} 輪，${S.history[0].total} 題全部拿下。`}</p>
    <div class="hist">${histLine()}</div></div>`;
  $("foot").innerHTML = `<button class="ghost" onclick="backToBanks()">‹ 題庫</button><span style="flex:1"></span><button class="primary" onclick="restart()">重新開始</button>`;
  header();
}

function retry(){
  S.pool = S.lastWrong.slice();
  S.pool.forEach(i => delete S.answers[i]);
  S.round += 1; S.phase = "quiz";
  save(); render(); window.scrollTo(0,0);
}
function restart(){ const sc=S.scope, ms=S.minStar; S = fresh(); S.scope=sc||"all"; S.minStar=ms??3; save(); render(); window.scrollTo(0,0); }

function render(){
  if (S.phase === "setup") renderSetup();
  else if (S.phase === "quiz") renderQuiz();
  else if (S.phase === "result") renderResult();
  else renderDone();
}

loadBanks();
</script>
</body>
</html>
